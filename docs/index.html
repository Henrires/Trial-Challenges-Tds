<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trial Rotation</title>

    <script src="scripts/main.js" defer></script>
    <script src="scripts/connections.js" defer></script>

    <link rel="icon" type="image/webp" href="../media/Icon.webp">
    <link rel="stylesheet" href="scripts/style.css">
</head>

<body>
    <div class="wrap">
        <div class="upperRow">
            <div id="calendar">DD/MM/YYYY HH:MM:SS</div>
            <button class="changeDate">Change Date</button>
            <input type="datetime-local"" id="datepicker" style="display: none;">
        </div>

        <div class="panel">
            <div class="now-card">
                <div class="now-label">Active now</div>
                <div class="now-name" id="nowName">—</div>
                <div class="now-meta" id="nowMeta">—</div>

                <div class="lower-row">
                    <div id="previousLabel">Previous:</div>
                    <div class="countdown" id="countdown">--:--:--</div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>

            <div class="section-title">Full rotation, in order</div>
            <div class="list" id="list"></div>
        </div>

        <footer>Fixed 3-hour rotation · 13 trials · repeats every 39 hours</footer>
    </div>
</body>

</html>
